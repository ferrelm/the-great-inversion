<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Unreliable Agent cover</title>
  <desc id="desc">Abstract cover with guardrail motif and warning markers for The Unreliable Agent companion article.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2533"/>
      <stop offset="100%" stop-color="#394b63"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b03a2e"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.22" stroke="#d6dce6" stroke-width="2">
    <line x1="120" y1="120" x2="1480" y2="120"/>
    <line x1="120" y1="230" x2="1480" y2="230"/>
    <line x1="120" y1="340" x2="1480" y2="340"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="560" x2="1480" y2="560"/>
    <line x1="120" y1="670" x2="1480" y2="670"/>
  </g>

  <g>
    <rect x="210" y="485" width="1180" height="82" rx="10" fill="#f5f1e8" opacity="0.95"/>
    <rect x="210" y="505" width="390" height="42" rx="8" fill="url(#warn)"/>
    <rect x="644" y="505" width="560" height="42" rx="8" fill="#bcc9da"/>
    <circle cx="1275" cy="526" r="16" fill="#b03a2e"/>
  </g>

  <text x="160" y="190" fill="#f8f6f1" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">The Unreliable Agent</text>
  <text x="160" y="250" fill="#d0dae8" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">Why Guardrails Are Not Guarantees</text>

  <text x="160" y="826" fill="#d7e0ec" font-family="Georgia, 'Times New Roman', serif" font-size="28">The Great Inversion • Companion Series</text>
</svg>
