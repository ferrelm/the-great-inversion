<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Burning Question cover</title>
  <desc id="desc">Abstract cover with energy bars and headline for The Burning Question companion article.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#632b20"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="130" r="280" fill="#ffffff" opacity="0.08"/>
  <circle cx="210" cy="790" r="300" fill="#f1c40f" opacity="0.08"/>

  <g opacity="0.8">
    <rect x="160" y="620" width="240" height="130" rx="10" fill="url(#hot)"/>
    <rect x="450" y="520" width="240" height="230" rx="10" fill="url(#hot)"/>
    <rect x="740" y="410" width="240" height="340" rx="10" fill="url(#hot)"/>
    <rect x="1030" y="300" width="240" height="450" rx="10" fill="url(#hot)"/>
  </g>

  <text x="160" y="190" fill="#f8f6f1" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">The Burning Question</text>
  <text x="160" y="255" fill="#e0e4ec" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic">Can the AI Economy Afford Itself?</text>

  <text x="160" y="826" fill="#f5d7d1" font-family="Georgia, 'Times New Roman', serif" font-size="28">The Great Inversion • Companion Series</text>
</svg>
