<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Inversion, Confirmed cover</title>
  <desc id="desc">Abstract cover with an abstraction-ladder motif and a highlighted top rung for The Inversion, Confirmed follow-up article.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2533"/>
      <stop offset="100%" stop-color="#394b63"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b03a2e"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.22" stroke="#d6dce6" stroke-width="2">
    <line x1="120" y1="120" x2="1480" y2="120"/>
    <line x1="120" y1="230" x2="1480" y2="230"/>
    <line x1="120" y1="340" x2="1480" y2="340"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="560" x2="1480" y2="560"/>
    <line x1="120" y1="670" x2="1480" y2="670"/>
  </g>

  <g>
    <rect x="1090" y="300" width="22" height="470" rx="6" fill="#bcc9da" opacity="0.85"/>
    <rect x="1300" y="300" width="22" height="470" rx="6" fill="#bcc9da" opacity="0.85"/>
    <rect x="1090" y="690" width="232" height="34" rx="8" fill="#bcc9da"/>
    <rect x="1090" y="585" width="232" height="34" rx="8" fill="#bcc9da"/>
    <rect x="1090" y="480" width="232" height="34" rx="8" fill="#bcc9da"/>
    <rect x="1090" y="375" width="232" height="34" rx="8" fill="#bcc9da"/>
    <rect x="1078" y="285" width="256" height="44" rx="9" fill="url(#warn)"/>
    <circle cx="1206" cy="307" r="13" fill="#1b2533" opacity="0.55"/>
  </g>

  <text x="160" y="190" fill="#f8f6f1" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">The Inversion, Confirmed</text>
  <text x="160" y="250" fill="#d0dae8" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">The rung of the ladder I never saw coming</text>

  <text x="160" y="826" fill="#d7e0ec" font-family="Georgia, 'Times New Roman', serif" font-size="28">The Great Inversion • Follow-Up</text>
</svg>
